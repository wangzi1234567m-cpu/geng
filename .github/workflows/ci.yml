name: Foundation checks
on:
  pull_request:
  push:
    branches: [main, "codex/**", "feat/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.0"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm audit
      - run: bash tools/install-quality-linux.sh
      - run: .tools/quality/linux/actionlint
      - name: Scan versioned history and candidate source
        run: |
          node tools/build-review-snapshot.mjs "$GITHUB_WORKSPACE/.dev/review-snapshots/ci"
          .tools/quality/linux/gitleaks git . --redact=100 --no-banner
          .tools/quality/linux/gitleaks dir .dev/review-snapshots/ci --redact=100 --no-banner
      - run: .tools/quality/linux/osv-scanner scan source -L android/app/gradle.lockfile -L package-lock.json
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
        env:
          POSTGRES_DB: geng_dev
          POSTGRES_USER: geng_admin
          # Disposable CI-only database; these values are never production secrets.
          POSTGRES_PASSWORD: ci-admin-only
        ports: ["127.0.0.1:55432:5432"]
        options: >-
          --health-cmd 'pg_isready -U geng_admin -d geng_dev'
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGPASSWORD: ci-admin-only
      GENG_DB_PASSWORD: ci-app-only
      GENG_MIGRATION_PASSWORD: ci-migrator-only
      GENG_IT_ADMIN_PASSWORD: ci-admin-only
      GENG_DB_URL: jdbc:postgresql://127.0.0.1:55432/geng_foundation_it
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21.0.13+9"
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - name: Bootstrap roles and dedicated integration DB
        shell: bash
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 55432 -U geng_admin -d geng_dev -v ON_ERROR_STOP=1 --set=app_password="$GENG_DB_PASSWORD" --set=migration_password="$GENG_MIGRATION_PASSWORD" -f deploy/postgres/bootstrap.sql
          createdb -h 127.0.0.1 -p 55432 -U geng_admin geng_foundation_it
          psql -X -h 127.0.0.1 -p 55432 -U geng_admin -d geng_foundation_it -v ON_ERROR_STOP=1 <<'SQL'
          REVOKE ALL ON DATABASE geng_foundation_it FROM PUBLIC;
          GRANT CONNECT ON DATABASE geng_foundation_it TO geng_app,geng_migrator;
          GRANT CREATE ON DATABASE geng_foundation_it TO geng_migrator;
          REVOKE ALL ON SCHEMA public FROM PUBLIC;
          CREATE SCHEMA ops AUTHORIZATION geng_migrator;
          SQL
      - name: Empty DB migration and idempotent re-run
        working-directory: backend
        run: |
          sh ./mvnw -B -ntp -N flyway:migrate
          sh ./mvnw -B -ntp -N flyway:migrate flyway:validate
      - run: sh ./mvnw -B -ntp -Ppostgres-it,sbom verify
        working-directory: backend
      - run: bash tools/install-quality-linux.sh
      - run: .tools/quality/linux/osv-scanner scan source -L backend/target/classes/META-INF/sbom/application.cdx.json
      - name: Build application container without local secrets
        run: docker build --tag geng-foundation:ci backend
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21.0.13+9"
      - name: Install fixed SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: sh ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
        working-directory: android
